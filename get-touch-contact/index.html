    <!-- title -->
    <title>Get Touch Contact with HTML CSS!</title>

    <!-- favicon -->
    <!-- <link href="img/favicon.png" type="image/png" rel="icon"> -->

    <!-- all css here -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link href="css/fontawesome.min.css" rel="stylesheet" type="text/css" />
    <link href="css/style.css" rel="stylesheet" type="text/css" />
</head>
<body>
    

    <div class="contact_wrapper">
        <div class="container">
            <div class="contact_wrap">
                <div class="row">
                    <div class="col-lg-6">
                        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d9305.701577754659!2d5.5927562720700825!3d52.16111005150582!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x47c64b94c3a4cefd%3A0xbc412f21c9010b40!2sHarselaar%2C%203771%20PP%20Barneveld%2C%20Netherlands!5e1!3m2!1sen!2sbd!4v1767934128320!5m2!1sen!2sbd" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                    </div>
                    <div class="col-lg-6">
                        <form>
                            <h3>Get In Touch</h3>
                            <div class="row">
                                <div class="col-md-6 mt_20">
                                    <input type="text" placeholder="Enter Your Name">
                                </div>
                                <div class="col-md-6 mt_20">
                                    <input type="text" placeholder="Enter Your Number">
                                </div>
                                <div class="col-md-6 mt_20">
                                    <input type="text" placeholder="Enter Your Email">
                                </div>
                                <div class="col-md-6 mt_20">
                                    <input type="text" placeholder="Select Services">
                                </div>
                                <div class="col-lg-12 mt_20">
                                    <input type="text" placeholder="Enter Your Name">
                                    <textarea class="mt_20" placeholder="Enter Yoru Messanger"></textarea>
                                    <button class="mt_20">Send Message <i class="far fa-arrow-right"></i></button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
